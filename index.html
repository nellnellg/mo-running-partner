<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo, a shopping agent for running shoes</title>
<meta name="description" content="A prototype of Mo, an independent shopping agent that keeps an eye on your running shoes and helps you choose the next pair.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root{--bg:#F6F1E8;--raised:#FFFDF9;--ink:#14244F;--ink2:#52607F;--ink3:#A3ADC2;--line:#E3D7C2;--line2:#A3ADC2;--cobalt:#1F55D6;--cobalt-h:#1A45AD;--c50:#EEF3FF;--c100:#DCE6FE;--c200:#B9CDFC;--ro:#DC440D;--ro7:#9A2D09;--ro50:#FFF0EA;--green:#7ABA5C;--greenink:#3F7A2A;--sun:#EBCE78;--rail:96px;--tab:68px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);font-family:'Archivo',system-ui,sans-serif;color:var(--ink)}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h2,h3{margin:0}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:20px;padding-right:20px}
/* Navigation: a rail on desktop, a top bar and a tab bar on phones. */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--raised);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;z-index:30}
.logo{display:inline-flex}
.logo svg{display:block;height:30px;width:auto}
.rail .logo{margin-bottom:22px}
.nav{width:76px;border:0;background:transparent;border-radius:14px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.nav svg{width:26px;height:26px}
.nav:hover{background:var(--c50)}
.nav[aria-current="page"]{background:var(--c50);color:var(--cobalt)}
.push{flex:1}
.prof{width:40px;height:40px;border-radius:50%;border:0;background:var(--ro);color:#fff;display:flex;align-items:center;justify-content:center;cursor:default}
.prof svg{width:22px;height:22px}
.topbar{display:none}
.tabbar{display:none}
#home,.sheetWrap{margin-left:var(--rail)}
#home{padding-left:20px;padding-right:20px}
#home>.inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:34px;padding:44px 0 64px}
/* Mo speaks first */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.mofig{position:relative;width:170px;height:170px}
.mofig img,.moimg img{-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 86%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 86%,transparent 100%)}
.mofig img{position:absolute;inset:0;width:170px;height:170px}
.mofig .closed{opacity:0}
.mofig.blink .closed{opacity:1}
.says{position:relative;margin-top:10px;max-width:520px;background:var(--raised);border-radius:20px;padding:20px 26px 22px;box-shadow:0 6px 20px rgba(20,36,79,.10);display:flex;flex-direction:column;align-items:center;gap:16px}
.says:before{content:'';position:absolute;top:-8px;left:50%;width:18px;height:18px;background:var(--raised);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.says p{position:relative;margin:0;font-size:20px;line-height:1.4}
.says .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.says .txt{flex-basis:100%}
.b1,.b2{min-height:44px;border-radius:12px;padding:0 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.b1{border:1.5px solid var(--cobalt);background:var(--cobalt);color:#fff}
.b1:hover{background:var(--cobalt-h);border-color:var(--cobalt-h)}
.b2{border:1px solid var(--line2);background:var(--raised);color:var(--ink)}
.b2:hover{background:var(--c50)}
.b1.on,.b2.on{background:#EEF7E9;color:var(--greenink);border-color:#B9DCA8}
.txt{min-height:32px;border:0;background:transparent;padding:0;color:var(--cobalt);font-size:14px;font-weight:600;text-decoration:underline}
/* Race */
.raceline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:15px;min-height:32px}
.raceline:empty{display:none}
.raceline button,.racedone button{min-height:32px;border:0;background:transparent;padding:0;color:var(--cobalt);font-size:14px;font-weight:600;text-decoration:underline}
.racedone{font-size:15px;font-weight:600}
.racecard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 28px;background:var(--ink);color:#fff;border-radius:20px;padding:22px 28px}
.racecard .rc-n{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.racecard .rc-n b{font-stretch:66%;font-weight:760;font-size:clamp(64px,17vw,104px);letter-spacing:-0.02em;color:var(--ro);font-variant-numeric:tabular-nums}
.racecard .rc-n span{font-size:13px;font-weight:600;color:#D7DCEA;margin-top:2px}
.racecard .rc-t{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:15px;color:#D7DCEA}
.racecard .rc-k{font-size:13px;font-weight:600}
.racecard h3{margin:0;font-stretch:68%;font-weight:740;font-size:clamp(26px,6vw,38px);line-height:1.05;color:#fff}
.racecard .rc-s{margin-top:6px;font-size:14px;font-weight:600;color:#fff}
.racecard .rc-s.miss{color:var(--sun)}
.racecard button{align-self:start;min-height:32px;border:0;background:transparent;padding:0;color:#fff;font-size:14px;font-weight:600;text-decoration:underline}
.racecard .rc-pv{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:#D7DCEA}
.racecard .rc-pv span{margin-right:4px}
.racecard .rc-pv button{min-height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.7);border-radius:999px;text-decoration:none;font-size:13px}
.racecard .rc-pv button:hover{background:rgba(255,255,255,.1)}
/* Rotation */
.rhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.rhead h2{display:inline;font-size:21px;font-weight:700;letter-spacing:-0.01em;margin-right:10px}
.rhead span{font-size:14px;color:var(--ink2)}
.rhead .b2{min-height:40px;font-size:14px}
.shelf{background:var(--c50);border-radius:20px 20px 0 0;border-bottom:4px solid var(--ink);display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);padding:8px 8px 0;overflow-x:auto}
.shelf.one{grid-auto-columns:minmax(0,1fr)}
.shelf .shoe{position:relative;grid-row:span 5;display:grid;grid-template-rows:subgrid;row-gap:6px;padding:18px 16px 20px;min-width:0;border-radius:12px}
.shelf .shoe + .shoe:before{content:'';position:absolute;left:0;top:12px;bottom:12px;border-left:1px solid var(--c200)}
.shelf .shoe.just{background:var(--raised);box-shadow:inset 0 0 0 2px var(--cobalt)}
.shelf .shoe.just:before{display:none}
.shelf .shoe.just + .shoe:before{display:none}
.shelf .talk{position:absolute;inset:0;border:0;background:transparent;border-radius:12px;z-index:1}
.shelf .talk:hover{background:rgba(31,85,214,.05)}
.shelf .tag{position:absolute;top:-2px;left:14px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--cobalt);color:#fff;z-index:2}
.shelf .use{font-size:14px;font-weight:500;color:var(--ink2);min-height:21px}
.shelf .name{margin:0;font-stretch:68%;font-weight:760;font-size:28px;line-height:1.02}
.shelf .name .brand{display:block;font-stretch:100%;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px;min-height:18px}
.shelf .mi{margin:14px 0 0;font-stretch:66%;font-weight:720;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;align-self:end}
.shelf .mi small{font-stretch:100%;font-size:15px;font-weight:500;color:var(--ink2);margin-left:5px}
.shelf .wearbar{height:6px;border-radius:3px;background:var(--c100);overflow:hidden;align-self:center}
.shelf .wearbar i{display:block;height:6px;border-radius:3px}
.shelf .sfoot{display:flex;flex-direction:column;gap:10px;min-height:44px;font-size:14px;color:var(--ink2)}
.shelf.one .sfoot{min-height:21px}
.shelf .sfoot .due{font-weight:600;color:var(--ro7)}
.shelf .vacant .name{color:var(--ink2)}
.next{position:relative;z-index:2;background:var(--raised);border:1px solid var(--cobalt);border-radius:12px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px}
.next small{font-size:12px;font-weight:600;color:var(--cobalt)}
.next b{font-size:14px;font-weight:600;color:var(--ink)}
.next .lk{gap:0 12px;font-size:13px}
.empty{background:var(--c50);border-radius:20px 20px 0 0;border-bottom:4px solid var(--ink);padding:30px 28px}
.empty b{display:block;font-size:22px;color:var(--ink2);margin-bottom:6px}
.empty span{font-size:15px;color:var(--ink2)}
.foot{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;font-size:13px;color:var(--ink2)}
.foot .txt{font-size:13px;color:var(--ink2);font-weight:500}
/* Links */
.lk{display:flex;flex-wrap:wrap;gap:0 16px;font-size:14px;font-weight:600}
.lk a{display:inline-flex;align-items:center;min-height:32px;color:var(--cobalt);text-decoration:underline}
.lkb{min-height:32px;border:0;background:transparent;padding:0;color:var(--cobalt);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.lk .stock{flex-basis:100%;font-size:13px;font-weight:400;color:var(--ink2)}
.b .lk{margin-top:8px}
/* Chat */
.sheetWrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.stop{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;padding:12px 20px 4px;max-width:820px;width:100%;margin:0 auto}
.stop .brand{display:flex;flex-direction:column;align-items:center;gap:0}
.stop .brand #logo2{display:block;line-height:0}
.stop .brand>div{display:flex;flex-direction:column;align-items:center;margin-top:-12px;position:relative}
.stop .brand b{display:block;font-size:15px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:5px 16px;box-shadow:0 0 0 3px var(--bg)}
.stop .brand span#status2{display:block;min-height:16px;margin-top:3px;font-size:12px;color:var(--ink2)}
.stop .hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;justify-self:end}
.stop .lead{width:48px}
.cq{font-size:14px;font-weight:600}
.ghost{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);font-size:14px;font-weight:600}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--raised);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scroller{flex:1;overflow-y:auto;min-height:0}
main{flex-grow:1;padding-top:20px;padding-bottom:24px;display:flex;flex-direction:column;gap:14px}
.av{border-radius:50%;flex-shrink:0;object-fit:cover;background:#fff;box-shadow:0 0 0 1px var(--line)}
.you{display:flex;justify-content:flex-end}
.yb{max-width:78%;background:var(--ink);color:#fff;font-size:15px;line-height:1.5;padding:10px 14px;border-radius:16px 16px 4px 16px;border:0;text-align:left;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.mo{display:flex;gap:12px;align-items:flex-start}
.mo .b{max-width:86%;font-size:16px;line-height:1.55;white-space:pre-line;background:var(--c50);padding:10px 14px;border-radius:4px 16px 16px 16px;margin-top:2px}
.ind{margin-left:0}
.moimg img{display:block;width:200px;height:200px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:16px}
.pvnote{align-self:center;font-size:13px;font-weight:600;color:var(--ink2);background:#EFE7D8;border-radius:999px;padding:6px 14px;margin:0 auto 4px;width:fit-content}
.typing{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--ink2)}
.old{border:1px dashed var(--line2);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.cap{font-size:12px;color:var(--ink2);margin-top:8px}
footer{background:transparent}
footer .wrap{padding-top:12px;padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.plan{background:var(--ink);color:#fff;border-radius:14px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plan .l{display:flex;align-items:center;gap:12px}
.plan b{display:block;font-size:15px;font-weight:600}
.plan small{font-size:13px;color:#C9D1E6}
.plan .lk a,.plan .lkb{color:#fff}
.plan .lk .stock{color:#C9D1E6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--raised);font-size:14px;font-weight:500}
.box{display:flex;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--line2);border-radius:999px;padding:6px 6px 6px 22px;box-shadow:0 6px 24px rgba(20,36,79,.08)}
.box input{flex-grow:1;min-width:0;border:0;outline:none;font-size:15px;height:44px;background:transparent}
.box button{width:44px;height:44px;border-radius:50%;border:0;background:var(--cobalt);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* Forms */
.add{display:flex;flex-direction:column;gap:20px}
.add fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.add legend{padding:0;margin-bottom:8px;font-size:16px;font-weight:600}
.add .q{width:100%;height:48px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;font-size:16px;background:var(--raised)}
.add .res{display:flex;flex-direction:column}
.add .res button{min-height:44px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;font-size:15px}
.add .res button:hover{background:var(--c50)}
.add .races button{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 12px}
.add .races b{font-weight:600}
.add .races span{font-size:13px;color:var(--ink2)}
.add .chosen{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px}
.add .chosen button,.add .picked button{min-height:44px;border:0;background:transparent;padding:0;color:var(--cobalt);font-size:14px;font-weight:600;text-decoration:underline}
.add .opts{display:flex;flex-wrap:wrap;gap:8px}
.add .opts button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--raised);font-size:14px;font-weight:500}
.add .opts button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.add .picked{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:600}
.add .go{height:48px;border-radius:12px;border:0;background:var(--cobalt);color:#fff;font-size:15px;font-weight:600}
.add .go:disabled{background:#E3E5EA;color:var(--ink2);cursor:not-allowed}
.rot{display:flex;flex-direction:column;gap:8px}
.rot .rl{font-size:14px;font-weight:600;color:var(--ink2)}
.saved{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--ink2)}
.saved button{min-height:32px;border:0;background:transparent;padding:0;color:var(--cobalt);font-size:13px;font-weight:600;text-decoration:underline}
/* Add a shoe sheet over Rotation */
.addWrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:56px 16px 16px}
.addWrap .backdrop{position:absolute;inset:0;background:rgba(20,36,79,.45)}
.addsheet{position:relative;width:100%;max-width:560px;max-height:calc(100vh - 72px);overflow-y:auto;background:var(--raised);border-radius:24px;padding:24px 28px 28px;box-shadow:0 24px 64px rgba(20,36,79,.35)}
.addsheet .ahead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.addsheet h2{font-size:24px;font-weight:700}
.addsheet .add{gap:22px}
.addsheet .acts{display:flex;align-items:center;gap:16px}
.addsheet .go{padding:0 24px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:45;background:var(--ink);color:#fff;border-radius:999px;padding:6px 22px 6px 8px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(20,36,79,.25);margin-left:calc(var(--rail) / 2)}
.toast img{width:44px;height:44px;border-radius:50%;object-fit:cover}
/* Picks */
.pk{display:flex;flex-direction:column;gap:12px}
.pk .forwhat{margin:6px 0 0;font-size:15px;font-weight:600;color:var(--ink2)}
.pk .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.pk .grid.solo{grid-template-columns:1fr}
.pk .top{grid-row:span 2;background:var(--raised);border:2px solid var(--cobalt);border-radius:18px;padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pk .tag{align-self:flex-start;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--c50);color:var(--cobalt)}
.pk .name{margin:0;font-stretch:68%;font-weight:760;font-size:26px;line-height:1.02}
.pk .name .brand{display:block;font-stretch:100%;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.pk .top .name{font-size:44px;line-height:.98}
.pk .why{margin:0;font-size:15px;line-height:1.45}
.pk .top .why{font-size:18px;line-height:1.4;font-weight:500}
.pk .top .spec{margin-top:auto}
.pk .spec{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.pk .spec div + div{border-left:1px solid var(--line);padding-left:14px}
.pk .spec b{display:block;font-stretch:66%;font-weight:720;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pk .spec span{font-size:13px;color:var(--ink2)}
.pk .feel{margin:0;font-size:14px;color:var(--ink2)}
.pk .acts{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.pk .alt{background:var(--raised);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pk .row{display:flex;gap:18px;font-stretch:66%;font-weight:720;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:2px}
.pk .row span{font-stretch:100%;font-size:13px;font-weight:400;color:var(--ink2);margin-left:4px}
.pk .budget{margin:0;font-size:14px;font-weight:500;color:var(--greenink)}
.pk .budget.warn{color:var(--ro7)}
/* Motion */
.pop{animation:mopop .35s ease-out}
.grow{animation:mogrow .5s ease-out}
@keyframes mopop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mogrow{from{width:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.pulse,.mo-pulse{animation:pulse 1s ease-in-out infinite}
.hop,.mo-hop{animation:hop .8s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.pop,.grow,.pulse,.mo-pulse,.hop,.mo-hop{animation:none}}
/* Phones */
@media (max-width:720px){
.rail{display:none}
#home,.sheetWrap{margin-left:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.topbar .logo svg{height:26px}
.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--tab);background:var(--raised);border-top:1px solid var(--line);z-index:30;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .nav{width:120px;flex-direction:column;padding:6px 0}
.sheetWrap{bottom:var(--tab)}
#home>.inner{padding:12px 0 calc(var(--tab) + 28px);gap:26px}
.mofig,.mofig img{width:130px;height:130px}
.says{padding:16px 18px 18px}
.says p{font-size:17px}
.toast{bottom:calc(var(--tab) + 16px);margin-left:0;width:max-content;max-width:calc(100vw - 32px)}
.addWrap{padding:0;align-items:flex-end}
.addsheet{border-radius:24px 24px 0 0;max-height:92vh;padding:22px 20px 28px}

.pk .grid{grid-template-columns:1fr}

.racecard{grid-template-columns:auto 1fr;padding:20px;gap:6px 18px}
