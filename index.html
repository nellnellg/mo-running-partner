<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo, your running partner</title>
<meta name="description" content="A prototype of Mo, an AI running partner that checks your shoe rotation and recommends what to buy next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBF6F2;font-family:'Archivo',system-ui,sans-serif;color:#2B1A12}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #B5461C;outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:20px;padding-right:20px}
header{background:#fff;border-bottom:1px solid #E3E5E8}
header .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:16px;font-weight:700}
.brand span{font-size:13px;color:#5B6068}
.ghost{height:44px;padding:0 16px;border-radius:10px;border:1px solid #D6D8DC;background:#fff;font-size:14px;font-weight:600}
main{flex-grow:1;padding-top:28px;padding-bottom:24px;display:flex;flex-direction:column;gap:14px}
.you{display:flex;justify-content:flex-end}
.you div{max-width:78%;background:#2B1A12;color:#fff;font-size:15px;line-height:1.5;padding:10px 14px;border-radius:16px 16px 4px 16px}
.mo{display:flex;gap:12px;align-items:flex-start}
.mo .b{max-width:82%;font-size:16px;line-height:1.55;white-space:pre-line;background:#FFF1E8;padding:10px 14px;border-radius:4px 16px 16px 16px;margin-top:6px}
.ind{margin-left:48px}
.card{background:#fff;border:1px solid #E3E5E8;border-radius:16px;padding:16px}
.lab{font-size:12px;font-weight:600;color:#5B6068;letter-spacing:.04em}
.steps{padding:6px 16px;border-radius:14px}
.step{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;color:#33373D}
.step b{font-size:13px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.slot{background:#F7F8F9;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.slot b{font-size:14px;font-weight:600}
.slot small{font-size:13px;line-height:1.4;color:#5B6068}
.badge{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.bad{background:#FEECEB;color:#B42318}.warn{background:#FFF4E0;color:#8A4B00}.ok{background:#E8F5EC;color:#1E6B3A}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pick{background:#fff;border:1px solid #E3E5E8;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pick.top{border:2px solid #F26B3A}
.pick .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.pick .tp{white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:#FDEBDF;color:#9A3412}
.pick .tp.lt{background:#EEF0F2;color:#4A4F57}
.pick .nm{font-size:18px;font-weight:700;line-height:1.2}
.pick .pr{font-size:20px;font-weight:700}
.pick .wy{font-size:14px;line-height:1.45}
.pick .fl{font-size:13px;color:#5B6068}
.pick button{margin-top:auto;height:44px;border-radius:10px;font-size:14px;font-weight:600;background:#fff;border:1px solid #D6D8DC}
.pick button.on{background:#E8F5EC;color:#1E6B3A;border-color:#A7D7B5}
.note{font-size:14px;line-height:1.5;padding:10px 14px;border-radius:12px;margin-top:10px}
.cap{font-size:12px;color:#5B6068;margin-top:8px}
.old{border:1px dashed #C4C8CE;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#5B6068}
.typing{display:flex;gap:12px;align-items:center;font-size:14px;color:#5B6068}
footer{position:sticky;bottom:0;background:#FBF6F2;border-top:1px solid #E3E5E8}
footer .wrap{padding-top:12px;padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.plan{background:#2B1A12;color:#fff;border-radius:14px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plan .l{display:flex;align-items:center;gap:12px}
.plan b{display:block;font-size:15px;font-weight:600}
.plan small{font-size:13px;color:#C9CDD2}
.plan button{height:44px;padding:0 16px;border-radius:10px;border:0;background:#fff;color:#2B1A12;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #D6D8DC;background:#fff;font-size:14px;font-weight:500}
.box{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #D6D8DC;border-radius:14px;padding:6px 6px 6px 16px}
.box input{flex-grow:1;min-width:0;border:0;outline:none;font-size:15px;height:44px;background:transparent}
.box button{width:44px;height:44px;border-radius:10px;border:0;background:#2B1A12;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.r{flex-shrink:0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.pulse{animation:pulse 1s ease-in-out infinite}
.hop{animation:hop .8s ease-in-out 3}
.ear{transform-origin:46px 44px;animation:ear 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse,.hop,.ear{animation:none}}
@media (max-width:520px){.slots{grid-template-columns:1fr}.ind{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<header><div class="wrap">
<div class="brand"><span id="logo"></span><div><b>Mo</b><span>Your running partner · prototype</span></div></div>
<button class="ghost" id="restart" type="button">Start over</button>
</div></header>
<main class="wrap" id="chat" aria-live="polite"></main>
<footer><div class="wrap">
<div id="plan"></div>
<div class="chips" id="chips"></div>
<form class="box" id="form">
<label class="sr" for="ask">Message Mo</label>
<input id="ask" type="text" autocomplete="off">
<button type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
</form>
</div></footer>
</div>

  later(1500,function(){set({work:1})});later(2300,function(){set({work:2})});later(3100,function(){set({work:3})});
  later(3300,function(){var w=L.worn(S);mo(function(){var o=[msg('mo','text',{text:'Here’s what I see before I recommend anything.'}),msg('mo','rotation')];
   if(w)o.push(msg('mo','text',{text:'One question first. Your '+S.shoeName+' has about '+S.shoeMiles+' miles on it. Do you want me to replace it, or keep it for easy runs a bit longer and focus on the gaps?'}));
   else o=o.concat(picksMsg(L.intro(S)));return o},{stage:w?'replace':'done'},700)});
 } else if(stage==='replace'){S.replace=v;
  mo(function(){return picksMsg(v?'Makes sense, it’s close to the end of its life. '+L.intro(S):'Got it, we’ll keep it going for now and I’ll remind you when it hits 500 miles. '+L.intro(S))},{stage:'done'});}
}
function refine(kind,text){
 if(S.typing)return;
 if(kind==='why'){you(text||'Why these?');return say(L.why(S))}
 var had=L.plan(S).picks.some(function(p){return p.brand===L.AVOID});
 you(text||{cheaper:'Can you find cheaper options?',cushion:'I want more cushion.',brand:'I don’t like Saucony. What else?'}[kind]);
 if(kind==='cheaper')S.cheaper=true;else if(kind==='cushion')S.cushion=true;else{S.avoid=true;ORDER.forEach(function(k){if(S.chosen[k]&&S.chosen[k].name.indexOf(L.AVOID)===0)delete S.chosen[k]})}
 mo(function(){return picksMsg(L.refineText(kind,S,had))});
}
function replies(){
 if(S.typing)return[];
 if(S.stage==='race')return[['5K or 10K','race','short'],['Half marathon','race','half'],['Marathon','race','full']];
 if(S.stage==='miles')return[15,25,35,45].map(function(x){return[x+' miles','miles',x]});
 if(S.stage==='shoes')return[['One daily trainer, about 410 mi','shoes',{kind:'one',miles:410}],['A daily trainer and an old race flat','shoes',{kind:'two',miles:410}],['Nothing yet','shoes',{kind:'none'}]];
 if(S.stage==='shoeMiles')return[['Under 200','shoeMiles',150],['200 to 350','shoeMiles',275],['Over 350','shoeMiles',410]];
 if(S.stage==='budget')return[200,350,500].map(function(x){return['$'+x,'budget',x,'Around $'+x]});
 if(S.stage==='replace')return[['Replace it','replace',true],['Keep it for now','replace',false]];
 if(S.stage==='done')return[['Cheaper options','r','cheaper'],['More cushion','r','cushion'],['Different brand','r','brand'],['Why these?','r','why']];
 return[];
}
var ORDER=['speed','easy','race'];
var current=[], latest=[];
function render(doScroll){
 var last=null;S.msgs.forEach(function(m){if(m.kind==='picks')last=m.id});
 var h='';latest=[];
 S.msgs.forEach(function(m){
  if(m.who==='you'){h+='<div class="you"><div>'+esc(m.text)+'</div></div>';return}
  if(m.kind==='text')h+='<div class="mo">'+rabbit(36,'idle')+'<div class="b">'+esc(m.text)+'</div></div>';
  else if(m.kind==='status'){h+='<div class="ind card steps">';['Reading your training','Checking the shoes you own','Searching options under $'+(S.budget||0)].forEach(function(l,i){
    var d=S.work>i,a=S.work===i;h+='<div class="step"><span>'+l+'</span><b style="color:'+(d?'#1E6B3A':a?'#B5461C':'#6B7078')+'">'+(d?'Done':a?'Working…':'Waiting')+'</b></div>'});h+='</div>'}
  else if(m.kind==='rotation'){h+='<div class="ind card"><span class="lab">ROTATION CHECK</span><div class="slots">';L.slots(S).forEach(function(x){h+='<div class="slot"><b>'+x[0]+'</b><span class="badge '+x[1][1]+'">'+x[1][0]+'</span><small>'+x[1][2]+'</small></div>'});h+='</div></div>'}
  else if(m.kind==='picks'){var pl=L.plan(m.snap),ps=pl.picks;
   if(m.id===last){latest=ps;h+='<div class="ind"><div class="picks">';ps.forEach(function(p){var on=!!(S.chosen[p.key]&&S.chosen[p.key].name===p.name);
     h+='<div class="pick'+(p.top?' top':'')+'"><div class="hd"><span class="lab">'+p.role+'</span>'+(p.top?'<span class="tp">Top pick</span>':p.later?'<span class="tp lt">Later</span>':'')+'</div><span class="nm">'+esc(p.name)+'</span><span class="pr">$'+p.price+'</span><span class="wy">'+esc(p.why)+'</span><span class="fl">Feel: '+p.feel+'</span><button type="button" data-add="'+p.key+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'">'+(on?'Added to plan':'Add to plan')+'</button></div>'});
    h+='</div><div class="note '+(pl.ok?'ok':'warn')+'">'+esc(pl.text)+'</div><div class="cap">List prices from September 2026. Check retailers for current deals.</div></div>'}
   else h+='<div class="ind old"><span class="lab">EARLIER PICKS</span><span>'+ps.map(function(p){return esc(p.name)+' $'+p.price}).join(' · ')+'</span></div>'}
 });
 if(S.typing)h+='<div class="typing">'+rabbit(36,'think','pulse')+'<span>Mo is thinking…</span></div>';
 $('chat').innerHTML=h;
 current=replies();
 $('chips').innerHTML=current.map(function(c,i){return'<button type="button" data-i="'+i+'">'+esc(c[0])+'</button>'}).join('');
 var ch=ORDER.filter(function(k){return S.chosen[k]}).map(function(k){return S.chosen[k]});
 var key=ch.map(function(p){return p.name}).join();
 if(key!==render.planKey){render.planKey=key;
  $('plan').innerHTML=ch.length?'<div class="plan"><div class="l">'+rabbit(40,'cheer','hop')+'<div><b>Your plan: '+ch.length+(ch.length===1?' shoe':' shoes')+', $'+ch.reduce(function(a,p){return a+p.price},0)+'</b><small>'+ch.map(function(p){return esc(p.name)}).join(' + ')+'</small></div></div><button type="button" id="find">Find best prices</button></div>':''}
 $('ask').placeholder={race:'Training for a half in March…',miles:'About 35 miles…',shoes:'Pegasus 41 with about 300 miles…',shoeMiles:'About 250 miles…',budget:'Around $350…',replace:'Replace it or keep it…',done:'Ask for cheaper, softer, another brand…'}[S.stage]||'Message Mo';
 if(doScroll)scroll();
}
function send(){
 var t=$('ask').value.trim();if(!t||S.typing||S.stage==='working')return;var q=t.toLowerCase(),v;
 if(S.stage==='race'){v=L.parseRace(t);if(v)return answer('race',v,t);you(t);return say('Is that a 5K or 10K, a half marathon or a marathon?')}
 if(S.stage==='miles'){v=L.parseMiles(t);if(v)return answer('miles',v,t);you(t);return say('Roughly how many miles do you run in a normal week? A number like 25 works.')}
 if(S.stage==='shoes')return answer('shoes',L.parseShoes(t),t);
 if(S.stage==='shoeMiles'){v=L.parseShoeMiles(t);if(v!=null)return answer('shoeMiles',v,t);you(t);return say('A rough number is fine, like 250.')}
 if(S.stage==='budget'){v=L.parseBudget(t);if(v)return answer('budget',v,t);you(t);return say('What’s a dollar amount you’re comfortable with? Something like $300 works.')}
 if(S.stage==='replace')return answer('replace',L.parseReplace(t),t);
 if(/cheap|budget|price|less|afford/.test(q))return refine('cheaper',t);if(/cushion|soft|comfort|plush/.test(q))return refine('cushion',t);if(/brand|saucony|don.t like|hate/.test(q))return refine('brand',t);if(/why|how/.test(q))return refine('why',t);
 you(t);say('In this prototype I can adjust for price, cushion or brand, or explain my picks. Try one of those.');
}
function start(){timers.forEach(clearTimeout);timers=[];S=fresh();render.planKey=null;render();window.scrollTo(0,0)}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.id==='restart')return start();
 if(b.id==='find'){if(S.typing)return;you('Find the best prices for my plan.');return mo(function(){return[msg('mo','text',{text:'On it. Next I’d check retailers for price, stock and your size, then send you to the best deal. That flow comes in the next version of this prototype.'})]})}
 if(b.dataset.add){var k=b.dataset.add,pk=latest.filter(function(p){return p.key===k})[0];if(!pk)return;if(S.chosen[k]&&S.chosen[k].name===pk.name)delete S.chosen[k];else S.chosen[k]={name:pk.name,price:pk.price};return render()}
 if(b.dataset.i!==undefined){var c=current[+b.dataset.i];if(!c)return;if(c[1]==='r')refine(c[2]);else answer(c[1],c[2],c[3]||c[0])}
});
$('form').addEventListener('submit',function(e){e.preventDefault();send()});
$('logo').innerHTML=rabbit(40,'idle');
start();
})();
