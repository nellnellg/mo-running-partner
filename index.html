<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo, your running partner</title>
<meta name="description" content="A prototype of Mo, an AI running partner that checks your shoe rotation and recommends what to buy next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:#FBF6F2;font-family:'Archivo',system-ui,sans-serif;color:#2B1A12}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #B5461C;outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:20px;padding-right:20px}
header{background:#fff;border-bottom:1px solid #E3E5E8;position:sticky;top:0;z-index:5}
header .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:16px;font-weight:700}
.hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cq{font-size:14px;font-weight:600}
h2,h3{margin:0}
.brand span{font-size:13px;color:#5B6068}
.ghost{height:44px;padding:0 16px;border-radius:10px;border:1px solid #D6D8DC;background:#fff;font-size:14px;font-weight:600}
main{flex-grow:1;padding-top:28px;padding-bottom:24px;display:flex;flex-direction:column;gap:14px}
.you{display:flex;justify-content:flex-end}
.yb{max-width:78%;background:#2B1A12;color:#fff;font-size:15px;line-height:1.5;padding:10px 14px;border-radius:16px 16px 4px 16px;border:0;text-align:left;display:inline-flex;align-items:center;gap:8px;min-height:44px}
button.yb svg{flex-shrink:0;opacity:.8}
button.yb:hover{background:#45302A}
.mo{display:flex;gap:12px;align-items:flex-start}
.mo .b{max-width:82%;font-size:16px;line-height:1.55;white-space:pre-line;background:#FFF1E8;padding:10px 14px;border-radius:4px 16px 16px 16px;margin-top:6px}
.ind{margin-left:48px}
.card{background:#fff;border:1px solid #E3E5E8;border-radius:16px;padding:16px}
.step{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;color:#33373D}
.step b{font-size:13px;font-weight:600}
.bad{background:#FEECEB;color:#B42318}.warn{background:#FFF4E0;color:#8A4B00}.ok{background:#E8F5EC;color:#1E6B3A}
.lk{display:flex;flex-wrap:wrap;gap:0 16px;font-size:14px;font-weight:600}
.lk a{display:inline-flex;align-items:center;min-height:32px;color:#9A3412;text-decoration:underline}
.add{display:flex;flex-direction:column;gap:20px}
.add fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.add legend{padding:0;margin-bottom:8px;font-size:16px;font-weight:600}
.add .q{width:100%;height:48px;border:1px solid #D6D8DC;border-radius:12px;padding:0 14px;font-size:16px;background:#fff}
.add .res{display:flex;flex-direction:column}
.add .res button{min-height:44px;text-align:left;border:0;border-bottom:1px solid #EEF0F2;background:transparent;padding:8px 2px;font-size:15px}
.add .res button:hover{background:#FBF6F2}
.add .opts{display:flex;flex-wrap:wrap;gap:8px}
.add .opts button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #D6D8DC;background:#fff;font-size:14px;font-weight:500}
.add .opts button[aria-pressed="true"]{background:#2B1A12;border-color:#2B1A12;color:#fff}
.add .picked{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:600}
.add .picked button{min-height:44px;border:0;background:transparent;color:#9A3412;font-size:14px;font-weight:600;text-decoration:underline}
.add .go{height:48px;border-radius:12px;border:0;background:#2B1A12;color:#fff;font-size:15px;font-weight:600}
.add .go:disabled{background:#E3E5E8;color:#5B6068;cursor:not-allowed}
.rot{display:flex;flex-direction:column;gap:8px}
.rot .rl{font-size:14px;font-weight:600;color:#5B6068}
.saved{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:8px;font-size:13px;color:#5B6068}
.saved button{min-height:32px;border:0;background:transparent;padding:0;color:#9A3412;font-size:13px;font-weight:600;text-decoration:underline}
.pop{animation:mopop .35s ease-out}
.grow{animation:mogrow .5s ease-out}
@keyframes mopop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mogrow{from{width:0}}
@media (prefers-reduced-motion:reduce){.pop,.grow{animation:none}}
.shelf{background:#FFF1E8;border-radius:20px 20px 0 0;border-bottom:4px solid #2B1A12;display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);padding:8px 8px 0;overflow-x:auto}
.shelf.one{grid-auto-columns:minmax(0,1fr)}
.shelf .shoe{grid-row:span 5;display:grid;grid-template-rows:subgrid;row-gap:6px;padding:18px 16px 20px;min-width:0}
.shelf .shoe + .shoe{border-left:1px solid #F2DDCF}
.shelf .use{font-size:14px;font-weight:500;color:#6B5A50;min-height:21px}
.shelf .name{margin:0;font-stretch:68%;font-weight:760;font-size:28px;line-height:1.02}
.shelf .name .brand{display:block;font-stretch:100%;font-size:13px;font-weight:600;color:#6B5A50;margin-bottom:5px;min-height:18px}
.shelf .mi{margin:14px 0 0;font-stretch:66%;font-weight:720;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;align-self:end}
.shelf .mi small{font-stretch:100%;font-size:15px;font-weight:500;color:#6B5A50;margin-left:5px}
.shelf .wearbar{height:6px;border-radius:3px;background:#F2DDCF;overflow:hidden;align-self:center}
.shelf .wearbar i{display:block;height:6px;border-radius:3px}
.shelf .sfoot{display:flex;flex-direction:column;gap:10px;min-height:76px;font-size:14px;color:#6B5A50}
.shelf.one .sfoot{min-height:21px}
.shelf .sfoot .due{font-weight:600;color:#8A4B00}
.shelf .vacant .name{color:#6B5A50}
.shelf .txt{min-height:32px;border:0;background:transparent;padding:0;color:#9A3412;font-size:13px;font-weight:600;text-decoration:underline;text-align:left}
.raceline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:15px;min-height:32px}
.raceline:empty{display:none}
.raceline b{font-weight:600}
.raceline button,.racedone button{min-height:32px;border:0;background:transparent;padding:0;color:#9A3412;font-size:14px;font-weight:600;text-decoration:underline}
.racedone{font-size:15px;font-weight:600}
.b1,.b2{height:44px;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600}
.b1{border:1.5px solid #2B1A12;background:#2B1A12;color:#fff}
.b2{border:1.5px solid #2B1A12;background:transparent;color:#2B1A12}
.b1.on,.b2.on{background:#E8F5EC;color:#1E6B3A;border-color:#A7D7B5}
.shelf .sfoot .b1,.shelf .sfoot .b2{padding:0 8px;font-size:13.5px;white-space:nowrap}
.pk{display:flex;flex-direction:column;gap:12px}
.pk .forwhat{margin:6px 0 0;font-size:15px;font-weight:600;color:#5B6068}
.pk .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.pk .grid.solo{grid-template-columns:1fr}
.pk .top{grid-row:span 2;background:#fff;border:2px solid #F26B3A;border-radius:18px;padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pk .tag{align-self:flex-start;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:#FDEBDF;color:#9A3412}
.pk .name{margin:0;font-stretch:68%;font-weight:760;font-size:26px;line-height:1.02}
.pk .name .brand{display:block;font-stretch:100%;font-size:13px;font-weight:600;color:#5B6068;margin-bottom:5px}
.pk .top .name{font-size:44px;line-height:.98}
.pk .why{margin:0;font-size:15px;line-height:1.45}
.pk .top .why{font-size:18px;line-height:1.4;font-weight:500}
.pk .top .spec{margin-top:auto}
.pk .spec{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #EADFD6;border-bottom:1px solid #EADFD6;padding:12px 0}
.pk .spec div + div{border-left:1px solid #EADFD6;padding-left:14px}
.pk .spec b{display:block;font-stretch:66%;font-weight:720;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pk .spec span{font-size:13px;color:#5B6068}
.pk .feel{margin:0;font-size:14px;color:#5B6068}
.pk .acts{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.pk .alt{background:#fff;border:1px solid #EADFD6;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pk .row{display:flex;gap:18px;font-stretch:66%;font-weight:720;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:2px}
.pk .row span{font-stretch:100%;font-size:13px;font-weight:400;color:#5B6068;margin-left:4px}
.pk .budget{margin:0;font-size:14px;font-weight:500;color:#1E6B3A}
.pk .budget.warn{color:#8A4B00}
.plan .lk a{color:#fff}
@media (max-width:720px){
.shelf{display:block;padding:0;border-radius:18px 18px 0 0;overflow:visible}
.shelf .shoe{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto;column-gap:12px;row-gap:4px;padding:16px;border-left:0;border-bottom:1px solid #F2DDCF}
.shelf .shoe + .shoe{border-left:0}
.shelf .shoe .use{grid-column:1}
.shelf .shoe .name{grid-column:1;font-size:26px}
.shelf .shoe .mi{grid-column:2;grid-row:1 / span 2;font-size:52px;margin:0;align-self:center}
.shelf .shoe .wearbar{grid-column:1 / -1;margin-top:8px}
.shelf .shoe .sfoot{grid-column:1 / -1;min-height:0;margin-top:6px}
.pk .grid{grid-template-columns:1fr}
.pk .top .name{font-size:40px}
}
.cap{font-size:12px;color:#5B6068;margin-top:8px}
.old{border:1px dashed #C4C8CE;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#5B6068}
.typing{display:flex;gap:12px;align-items:center;font-size:14px;color:#5B6068}
footer{background:transparent}
.sheetWrap{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(43,26,18,.45)}
.sheet{position:absolute;inset:12px;background:#FBF6F2;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(43,26,18,.35)}
.stop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.stop .brand b{display:block;font-size:16px;font-weight:700}
.round{width:48px;height:48px;border-radius:50%;border:1px solid #E3E5E8;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scroller{flex:1;overflow-y:auto;min-height:0}
@media (max-width:600px){.sheet{inset:6px;border-radius:22px}#status2{display:none}}
footer .wrap{padding-top:12px;padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.plan{background:#2B1A12;color:#fff;border-radius:14px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plan .l{display:flex;align-items:center;gap:12px}
.plan b{display:block;font-size:15px;font-weight:600}
.plan small{font-size:13px;color:#C9CDD2}
.plan .done{font-size:14px;font-weight:600;color:#C9CDD2;padding:0 8px}
.plan button{height:44px;padding:0 16px;border-radius:10px;border:0;background:#fff;color:#2B1A12;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #D6D8DC;background:#fff;font-size:14px;font-weight:500}
.box{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #D6D8DC;border-radius:999px;padding:6px 6px 6px 22px;box-shadow:0 6px 24px rgba(43,26,18,.10)}
.box input{flex-grow:1;min-width:0;border:0;outline:none;font-size:15px;height:44px;background:transparent}
.box button{width:44px;height:44px;border-radius:50%;border:0;background:#2B1A12;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.r{flex-shrink:0}
@keyframes mo-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
@keyframes mo-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mo-eye{transform-box:fill-box;transform-origin:center;animation:mo-blink 4.5s infinite}
@keyframes mo-twitchk{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-12deg)}94%{transform:rotate(5deg)}97%{transform:rotate(-4deg)}}
.mo-twitch{transform-box:view-box;transform-origin:46px 50px;animation:mo-twitchk 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.mo-twitch{animation:none}}
@media (prefers-reduced-motion:reduce){.mo-eye,.mo-float,.mo-pulse,.mo-hop,.mo-ear{animation:none}}
.mo-pulse{animation:pulse 1s ease-in-out infinite}
.mo-hop{animation:hop .8s ease-in-out 3}
@keyframes mo-stepk{from{opacity:.35;filter:grayscale(1)}to{opacity:1;filter:none}}
@keyframes mo-ink{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes mo-breathek{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
.mo-step{animation:mo-stepk .45s ease backwards}
.mo-in{animation:mo-ink .5s ease 3.6s backwards}
.mo-breathe{transform-origin:50% 100%;animation:mo-breathek 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.mo-step,.mo-in,.mo-breathe{animation:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.pulse{animation:pulse 1s ease-in-out infinite}
.hop{animation:hop .8s ease-in-out 3}
.ear{transform-box:view-box;transform-origin:46px 44px;animation:ear 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse,.hop,.ear{animation:none}}
@media (max-width:520px){.ind{margin-left:0}}
</style>
</head>

<div class="app">
<header><div class="wrap">
<div class="brand"><span id="logo"></span><div><h1>Mo</h1></div></div>
<div class="hdr"><button class="ghost" data-act="chat" type="button">Chat with Mo</button></div>
</div></header>
<div class="wrap" id="home" style="max-width: 960px">

<script>
(function(){
// ----- A runner's own shoes, saved in this browser. -----
var KEY='mo.runner';

  ME.shoes=ME.shoes.filter(function(x){return x.name!==sh.name}).concat([sh]);saveMe();
  S.msgs.forEach(function(m){if(m.kind==='addshoe'&&!m.done)m.done=sh;if(m.forForm)m.forForm=false});S.cur=sh;S.form=newForm();S.stage='wait';afterAdd(sh)}}
function afterAdd(sh){
 if(!sh.role){say('Added to your rotation. I don’t have track shoes in my catalog yet, so I’ll keep this one in your rotation for now.',{stage:'mdone'});return later(900,settle)}
 if(sh.miles==null)return say('Added to your rotation. Without a mileage I’ll go by feel, so tell me when your '+sh.name+' starts to feel flat. Want to see what else is out there?',{stage:'mask'});
 if(sh.miles>=400)return say('Added to your rotation. Your '+sh.name+' is probably over 400 miles, might want to change it soon. Want to see some new options?',{stage:'mask'});
 say('Added to your rotation. Your '+sh.name+' probably has '+(sh.miles>=200?'some':'plenty of')+' life left, so there’s no rush. Want to look at something new anyway?',{stage:'mask'})}
function myRunner(){return{goal:ME.race?ME.race.name+' on '+raceDate(ME.race.date):undefined,budget:ME.budget&&ME.budget<9000?ME.budget:undefined,shoes:ME.shoes.map(function(x){var sp=SPEC[x.name]||{};return{name:x.name,brand:x.brand,use:x.use,miles:x.miles,w:sp.w,d:sp.d,weight:sp.w?sp.w+'g':undefined,drop:sp.d!=null?sp.d+'mm':undefined}})}}
function showMine(force){
 var sh=S.cur,B=ME.budget||9999,all=L.CAT[sh.role].filter(function(c){return c.name!==sh.name}),inB=all.filter(function(c){return c.price<=B});
 if(!inB.length&&!force){var min=Math.min.apply(null,all.map(function(c){return c.price}));return say((sh.gap?'Race shoes start':'Shoes for '+sh.label.toLowerCase()+' start')+' around $'+min+', which is over your $'+B+'. Want to see them anyway?',{stage:'mover'})}
 var list=inB.length?inB:all,rn=myRunner(),ref=rn.shoes.filter(function(x){return x.name===sh.name})[0]||{},due=sh.miles>=400;PREF=sh.brand;
 var need=sh.gap?{type:sh.use,why:'The runner is training for the '+ME.race.name+' and has no race shoe in their rotation.'}
  :{type:sh.use,why:due?sh.name+' is probably over 400 miles, by the runner’s own estimate.':'The runner wants to try something new for '+sh.use+' runs. Their '+sh.name+' still has life in it.',replaces:sh.name};
 askPicks(need,list,function(d){
  S.msgs=S.msgs.concat(optsMsgs(sh.role,sh.gap?'For the '+ME.race.name:due?'To replace your '+sh.name:'Something new for '+sh.label.toLowerCase(),list,d,
   sh.gap?'Here are the ones I’d look at for the '+ME.race.name+'.':due?'Here are the ones I’d look at to replace your '+sh.name+'.':'Here are a few that would be a change from your '+sh.name+'.',
   function(c){if(sh.gap)return c.brand&&c.brand===sh.brand?'Same brand as most of your rotation, built for race day.':'Built for race day, which is the one job your rotation doesn’t cover.';
    return c.brand&&c.brand===sh.brand?'Same brand as your '+sh.name+', if you want to stay with what you know.':c.w&&ref.w?(c.w<ref.w?'Lighter than your '+sh.name+' for the same kind of run.':'More shoe underfoot than your '+sh.name+' for the same kind of run.'):'A different take on the same kind of run as your '+sh.name+'.'},
   !inB.length?'These are over your $'+B+' budget. You asked to see them anyway.':B>=9000?'You set no budget limit, so these come from the full list.':'All of these are within your $'+B+' budget.',!!inB.length));
  S.typing=false;set({stage:'mdone'});scroll();settle()},rn)}
// ----- The race: Mo asks once, saves it, and checks the rotation against it. -----
function raceDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
function daysTo(d){return Math.ceil((new Date(d+'T12:00:00')-Date.now())/864e5)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function hasRaceShoe(){return ME.shoes.some(function(x){return x.role==='race'})}
function topBrand(){var n={},best='';ME.shoes.forEach(function(x){if(x.brand){n[x.brand]=(n[x.brand]||0)+1;if(!best||n[x.brand]>n[best])best=x.brand}});return best}
// Once a conversation settles, Mo asks about a race if it never has.
function settle(){if(ME.raceAsked||!ME.shoes.length)return;var mine=S;later(1800,function(){if(S!==mine||S.typing||S.stage!=='mdone')return;say('One more thing. Are you training for a race?',{stage:'rask'})})}
function raceForm(m,active){
 if(m.done)return'<div class="ind racedone">'+esc(m.done.name)+', '+raceDate(m.done.date)+'</div>';
 if(!active)return'';
 var f=S.rf,ok=f.name.trim().length>1&&f.date;
 return'<div class="ind card add" role="group" aria-label="Your race"><fieldset><legend>Which race?</legend><input id="raceName" class="q" type="text" autocomplete="off" placeholder="Like Miami Marathon" aria-label="Race name" value="'+esc(f.name)+'"></fieldset>'
  +'<fieldset><legend>When is it?</legend><input id="raceDate" class="q" type="date" aria-label="Race date" min="'+today()+'" value="'+esc(f.date)+'"></fieldset>'
  +'<button type="button" class="go" id="raceSave" data-f="race"'+(ok?'':' disabled')+'>Save my race</button></div>'}
function openRaceForm(lead){S.rf={name:ME.race?ME.race.name:'',date:ME.race?ME.race.date:''};S.msgs=S.msgs.filter(function(m){return!(m.kind==='raceform'&&!m.done)&&!m.forRace});
 mo(function(){return[msg('mo','text',{text:lead,forRace:true}),msg('mo','raceform')]},{stage:'rform'})}
function saveRace(){
 var f=S.rf;if(!(f.name.trim().length>1&&f.date)||S.typing)return;
 ME.race={name:f.name.trim(),date:f.date};ME.raceAsked=true;saveMe();
 S.msgs.forEach(function(m){if(m.kind==='raceform'&&!m.done)m.done=ME.race;if(m.forRace)m.forRace=false});S.stage='wait';
 var n=daysTo(ME.race.date),when=n<=0?'is today':n===1?'is tomorrow':'is '+n+' days away';
 if(!hasRaceShoe()&&!ME.noRaceShoe)say('Saved. The '+ME.race.name+' '+when+', and you don’t have a race shoe in your rotation yet. Want me to look at some?',{stage:'rgap'});
 else say('Saved. The '+ME.race.name+' '+when+'.',{stage:'mdone'})}
function mflow(act,label){
 if(S.typing)return;you(label);
 if(act==='opts'){if(!S.cur||!S.cur.role)return say('I don’t have shoes for that kind of run in my catalog yet.',{stage:'mdone'});if(ME.budget==null)return say('What’s your budget for this one?',{stage:'mbudget'});showMine()}
 else if(act==='force')showMine(true);
 else if(act==='later'){say('No problem. Your shoe is saved in this browser, so I’ll remember it next time.',{stage:'mdone'});later(900,settle)}
 else if(act==='raceYes')openRaceForm('Which race, and when is it?');
 else if(act==='raceNo'){ME.raceAsked=true;saveMe();say('No problem. Tell me if that changes.',{stage:'mdone'})}
 else if(act==='gapYes'){S.cur={gap:true,name:null,role:'race',label:'Race day',use:'race day',miles:null,brand:topBrand()};if(ME.budget==null)return say('What’s your budget for a race shoe?',{stage:'mbudget'});showMine()}
 else if(act==='gapNo'){ME.noRaceShoe=true;saveMe();say('Got it. I won’t bring it up again.',{stage:'mdone'})}
 else if(act==='another'){S.form=newForm();mo(function(){return[msg('mo','text',{text:'Sure. Tell me about the next one.',forForm:true}),msg('mo','addshoe')]},{stage:'add'})}
}
function mbudget(v,label){if(S.typing)return;you(label);ME.budget=v||9999;saveMe();showMine()}
function msend(t,q){
 var st=S.stage,v;
 if(st==='add'){if(!S.form.name)return pickName(t);return}
 if(st==='mask')return mflow(/\bno\b|not|later|nah/.test(q)?'later':'opts',t);
 if(st==='mbudget'){v=L.parseBudget(t);if(v)return mbudget(v,t);you(t);return say('A dollar amount works, like $180.')}
 if(st==='mover')return mflow(/\bno\b|not|later|nah/.test(q)?'later':'force',t);
 if(st==='rask')return mflow(/\bno\b|not|nah|nope/.test(q)?'raceNo':'raceYes',t);
 if(st==='rgap')return mflow(/\bno\b|not|nah|else|other/.test(q)?'gapNo':'gapYes',t);
 if(st==='rform'){if(!S.rf.name){S.rf.name=t;$('ask').value='';return render()}return}
 if(/\brace\b|marathon|\b5k\b|\b10k\b/.test(q)&&st==='mdone'){you(t);return openRaceForm(ME.race?'Sure. Here’s your race.':'Which race, and when is it?')}
 if(st==='mdone'&&/add|another|new shoe/.test(q))return mflow('another',t);
 you(t);say(st==='wait'?'One second, I’m not done yet.':'I can add another shoe to your rotation whenever you like.');
}
function replies(){
 if(S.typing)return[];
 if(S.stage==='mask')return[['Show me new options','m','opts'],['Not now','m','later']];
 if(S.stage==='mbudget')return[['$150','mb',150],['$200','mb',200],['$250','mb',250],['No limit','mb',0]];
 if(S.stage==='mover')return[['Show me anyway','m','force'],['Not now','m','later']];
 if(S.stage==='mdone')return[['Add another shoe','m','another']];
 if(S.stage==='rask')return[['Yes','m','raceYes'],['Not right now','m','raceNo']];
 if(S.stage==='rgap')return[['Yes, show me','m','gapYes'],['No, I race in something else','m','gapNo']];
 if(S.stage==='rform')return[];
 if(S.stage==='add'||S.stage==='wait')return[];
 return[];
}
var current=[], latest=[], cheerUntil=0;
function chosenList(){return ORDER.filter(function(k){return S.chosen[k]}).map(function(k){return S.chosen[k]})}
function render(){
 var last=null,lastAdd=null;S.msgs.forEach(function(m){if(m.kind==='addshoe')lastAdd=m.id;if(m.kind==='opts')last=m.id});home();
 var h='';latest=[];
 S.msgs.forEach(function(m){
  if(m.who==='you'){h+='<div class="you"><div class="yb">'+esc(m.text)+'</div></div>';return}
  if(m.kind==='text')h+='<div class="mo">'+rabbit(36,'idle')+'<div class="b">'+esc(m.text)+'</div></div>';
  else if(m.kind==='addshoe')h+=addForm(m,S.stage==='add'&&m.id===lastAdd);
  else if(m.kind==='raceform')h+=raceForm(m,S.stage==='rform');
  else if(m.kind==='opts'){
   if(m.id===last){latest=m.items;h+='<div class="ind pk"><h2 class="sr">Mo’s picks</h2><p class="forwhat">'+esc(m.items[0].role)+'</p><div class="grid'+(m.items.length===1?' solo':'')+'">'+m.items.map(pickHTML).join('')+'</div><p class="budget'+(m.ok?'':' warn')+'">'+esc(m.note)+'</p><div class="cap">List prices from fall 2026. Check retailers for current deals.</div></div>'}
   else h+='<div class="ind old"><span>Earlier picks</span><span>'+m.items.map(function(p){return esc(p.name)+' $'+p.price}).join(', ')+'</span></div>'}
 });
 if(S.typing)h+='<div class="typing">'+rabbit(36,'think','pulse')+'<span>Mo is thinking…</span></div>';
 $('chat').innerHTML=h;
 current=replies();
 $('chips').innerHTML=current.map(function(c,i){return'<button type="button" data-i="'+i+'">'+esc(c[0])+'</button>'}).join('');
 var ch=chosenList(),key=ch.map(function(p){return p.name}).join();
 if(key!==render.planKey){render.planKey=key;
  $('plan').innerHTML=ch.length?'<div class="plan"><div class="l">'+rabbit(40,'cheer','hop')+'<div><b>'+(ch.length===1?'Your pick: '+esc(ch[0].name)+', $'+ch[0].price:'Your picks: '+ch.length+' shoes, $'+ch.reduce(function(a,p){return a+p.price},0))+'</b><small>'+(ch.length===1?'Next, see it or try it on':ch.map(function(p){return esc(p.name)}).join(' + '))+'</small></div></div>'+(ch.length===1?links(ch[0].name,ch[0].brand,ch[0].url,ch[0].store):'')+'</div>':''}
 var mood=view==='chat'&&S.typing?'think':(Date.now()<cheerUntil?'cheer':'idle');
 if(mood!==render.mood){render.mood=mood;$('logo2').innerHTML=mood==='think'?rabbit(48,'think','mo-pulse'):mood==='cheer'?rabbit(48,'cheer','mo-hop'):rabbit(48,'idle','',false,true)}
 $('status2').textContent=mood==='think'?'Thinking…':mood==='cheer'?'Nice pick':(S.stage==='mdone'?'Ready when you are':'Your running partner');
 $('sheetWrap').hidden=view!=='chat';document.body.style.overflow=view==='chat'?'hidden':'';
 var ck=String(S.confirm)+view;
 if(ck!==render.hdrKey){render.hdrKey=ck;$('shdr').innerHTML=S.confirm?'<span class="cq">Start over and clear your pick?</span><button class="ghost" id="yes" type="button">Yes, start over</button><button class="ghost" id="no" type="button">Cancel</button>':'<button class="ghost" id="restart" type="button">Start over</button>'}
 $('ask').placeholder={add:'Or type your shoe’s name…',mask:'Yes or not now…',mbudget:'Around $180…',rask:'Yes or not right now…',rgap:'Yes or no…',rform:'Type the race name…',mover:'Show me anyway, or not now…',mdone:'Message Mo'}[S.stage]||'Message Mo';
}
// The home screen shows the runner's shelf, saved in this browser.
function home(){
 var rl=$('raceLine'),rk=JSON.stringify(ME.race||0)+ME.shoes.length+today();
 if(rl.dataset.k!==rk){rl.dataset.k=rk;var nd=ME.race?daysTo(ME.race.date):0;
  rl.innerHTML=ME.race?'<span>Training for the <b>'+esc(ME.race.name)+'</b> on '+raceDate(ME.race.date)+(nd>1?', '+nd+' days away':nd===1?', tomorrow':nd===0?', today':'')+'</span><button type="button" data-act="race">Change</button>':ME.shoes.length?'<button type="button" data-act="race">Add a race</button>':''}
 var g=$('rotGrid'),k=JSON.stringify(ME.shoes);if(g.dataset.k===k)return;g.dataset.k=k;
 g.innerHTML=ME.shoes.map(function(x){var w=wear(x.miles);
  return shoeHTML({use:x.label,brand:x.brand,name:shortName(x.name,x.brand),mi:miText(x.miles),pct:w.pct,color:w.color,foot:w.due?'<span class="due">Probably due</span><button type="button" class="b1" data-act="suggest" data-name="'+esc(x.name)+'">See what Mo suggests</button>':w.line})}).join('')
  +shoeHTML({cls:' vacant',name:ME.shoes.length?'Add another':'No shoes yet',foot:'<span>'+(ME.shoes.length?'Mo learns your rotation one shoe at a time.':'Add a shoe you run in. It takes three taps, and Mo saves it here.')+'</span><button type="button" class="b2" data-act="addshoe">Add a shoe</button>'+(ME.shoes.length?'<button type="button" class="txt" data-act="forget">Clear my shoes</button>':'<button type="button" class="txt" data-act="sample">Try it with a sample rotation</button>')})}
function send(){
 var t=$('ask').value.trim();if(!t||S.typing)return;var q=t.toLowerCase();
 if(S.stage==='add'){$('ask').value='';return msend(t,q)}
 if(TOPIC.test(q)){you(t);return say(OFF)}
 msend(t,q);
}
function start(){timers.forEach(clearTimeout);timers=[];S=fresh();render.planKey=null;render.hdrKey=null;render.mood=null;render();$('scroller').scrollTop=0}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.f)return formAct(b);
 if(b.dataset.shoe)return pickName(b.dataset.shoe);
 if(b.dataset.act==='addshoe'){view='chat';if(S.stage!=='add'&&!S.typing){S.form=newForm();S.msgs.push(msg('mo','text',{text:'Sure. Tell me about the next one.',forForm:true}),msg('mo','addshoe'));S.stage='add'}render();return scroll()}
 if(b.dataset.act==='rotation'){S.confirm=false;view='home';render();return setTimeout(function(){$('rotation').scrollIntoView({behavior:window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})},60)}
 if(b.dataset.act==='suggest'){var sg=ME.shoes.filter(function(x){return x.name===b.dataset.name})[0];if(!sg||S.typing)return;
  S.msgs=S.msgs.filter(function(m){return!(m.kind==='addshoe'&&!m.done)&&!m.forForm});S.form=newForm();S.cur=sg;S.confirm=false;view='chat';
  you('What do you suggest for my '+sg.name+'?');if(ME.budget==null)say('What’s your budget for this one?',{stage:'mbudget'});else showMine();return scroll()}
 if(b.dataset.act==='sample'){ME={shoes:SAMPLE.map(function(x){var o={added:Date.now()};for(var k in x)o[k]=x[k];return o})};saveMe();return start()}
 if(b.dataset.act==='race'){if(S.typing)return;S.confirm=false;view='chat';S.msgs=S.msgs.filter(function(m){return!(m.kind==='addshoe'&&!m.done)&&!m.forForm});S.form=newForm();openRaceForm(ME.race?'Sure. Here’s your race.':'Which race, and when is it?');return scroll()}
 if(b.dataset.act==='forget'){ME={shoes:[]};saveMe();return start()}
 if(b.dataset.act==='chat'){view='chat';render();scroll();return setTimeout(function(){$('ask').focus()},50)}
 if(b.id==='goHome'){S.confirm=false;view='home';return render()}
 if(b.id==='restart'){if(chosenList().length)return set({confirm:true});return start()}
 if(b.id==='yes')return start();
 if(b.id==='no')return set({confirm:false});
 if(b.dataset.pick){var pp=latest.filter(function(p){return p.name===b.dataset.pick})[0];if(!pp)return;if(S.chosen[pp.key]&&S.chosen[pp.key].name===pp.name)delete S.chosen[pp.key];else{S.chosen[pp.key]={name:pp.name,price:pp.price,brand:pp.brand,url:pp.url,store:pp.store};cheerUntil=Date.now()+2600;setTimeout(render,2700)}return render()}
 if(b.dataset.i!==undefined){var c=current[+b.dataset.i];if(!c)return;if(c[1]==='mb')mbudget(c[2],c[0]);else mflow(c[2],c[0])}
});
$('logo').innerHTML=rabbit(48,'idle','',false,true);
$('backdrop').addEventListener('click',function(){S.confirm=false;view='home';render()});
$('chat').addEventListener('input',function(e){if(e.target.id==='raceName'||e.target.id==='raceDate'){S.rf[e.target.id==='raceName'?'name':'date']=e.target.value;var sv=$('raceSave');if(sv)sv.disabled=!(S.rf.name.trim().length>1&&S.rf.date);return}if(e.target.id==='shoeQ'){S.form.q=e.target.value;$('shoeRes').innerHTML=resHTML(S.form.q)}});
$('chat').addEventListener('keydown',function(e){if(e.target.id==='shoeQ'&&e.key==='Enter'){e.preventDefault();var first=$('shoeRes').querySelector('button');if(first)pickName(first.dataset.shoe)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&view==='chat'){S.confirm=false;view='home';render()}});
$('form').addEventListener('submit',function(e){e.preventDefault();send()});
$('askHome').addEventListener('submit',function(e){e.preventDefault();var t=$('askH').value.trim();$('askH').value='';view='chat';render();if(t){$('ask').value=t;send()}else scroll()});

start();
})();
