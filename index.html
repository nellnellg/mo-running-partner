<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo, your running partner</title>
<meta name="description" content="A prototype of Mo, an AI running partner that checks your shoe rotation and recommends what to buy next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBF6F2;font-family:'Archivo',system-ui,sans-serif;color:#2B1A12}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #B5461C;outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:20px;padding-right:20px}
header{background:#fff;border-bottom:1px solid #E3E5E8}
header .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:16px;font-weight:700}
.brand span{font-size:13px;color:#5B6068}
.ghost{height:44px;padding:0 16px;border-radius:10px;border:1px solid #D6D8DC;background:#fff;font-size:14px;font-weight:600}
main{flex-grow:1;padding-top:28px;padding-bottom:24px;display:flex;flex-direction:column;gap:14px}
.you{display:flex;justify-content:flex-end}
.you div{max-width:78%;background:#2B1A12;color:#fff;font-size:15px;line-height:1.5;padding:10px 14px;border-radius:16px 16px 4px 16px}
.mo{display:flex;gap:12px;align-items:flex-start}
.mo .b{max-width:82%;font-size:16px;line-height:1.55;white-space:pre-line;background:#FFF1E8;padding:10px 14px;border-radius:4px 16px 16px 16px;margin-top:6px}
.ind{margin-left:48px}
.card{background:#fff;border:1px solid #E3E5E8;border-radius:16px;padding:16px}
.lab{font-size:12px;font-weight:600;color:#5B6068;letter-spacing:.04em}
.steps{padding:6px 16px;border-radius:14px}
.step{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;color:#33373D}
.step b{font-size:13px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.slot{background:#F7F8F9;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.slot b{font-size:14px;font-weight:600}
.slot small{font-size:13px;line-height:1.4;color:#5B6068}
.badge{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.bad{background:#FEECEB;color:#B42318}.warn{background:#FFF4E0;color:#8A4B00}.ok{background:#E8F5EC;color:#1E6B3A}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pick{background:#fff;border:1px solid #E3E5E8;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pick.top{border:2px solid #F26B3A}
.pick .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.pick .tp{white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:#FDEBDF;color:#9A3412}
.pick .nm{font-size:18px;font-weight:700;line-height:1.2}
.pick .pr{font-size:20px;font-weight:700}
.pick .wy{font-size:14px;line-height:1.45}
.pick .fl{font-size:13px;color:#5B6068}
.pick button{margin-top:auto;height:44px;border-radius:10px;font-size:14px;font-weight:600;background:#fff;border:1px solid #D6D8DC}
.pick button.on{background:#E8F5EC;color:#1E6B3A;border-color:#A7D7B5}
.note{font-size:14px;line-height:1.5;padding:10px 14px;border-radius:12px;margin-top:10px}
.old{border:1px dashed #C4C8CE;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#5B6068}
.typing{display:flex;gap:12px;align-items:center;font-size:14px;color:#5B6068}
footer{position:sticky;bottom:0;background:#FBF6F2;border-top:1px solid #E3E5E8}
footer .wrap{padding-top:12px;padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.plan{background:#2B1A12;color:#fff;border-radius:14px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plan .l{display:flex;align-items:center;gap:12px}
.plan b{display:block;font-size:15px;font-weight:600}
.plan small{font-size:13px;color:#C9CDD2}
.plan button{height:44px;padding:0 16px;border-radius:10px;border:0;background:#fff;color:#2B1A12;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid #D6D8DC;background:#fff;font-size:14px;font-weight:500}
.box{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #D6D8DC;border-radius:14px;padding:6px 6px 6px 16px}
.box input{flex-grow:1;min-width:0;border:0;outline:none;font-size:15px;height:44px;background:transparent}
.box button{width:44px;height:44px;border-radius:10px;border:0;background:#2B1A12;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.r{flex-shrink:0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.pulse{animation:pulse 1s ease-in-out infinite}
.hop{animation:hop .8s ease-in-out 3}
.ear{transform-origin:46px 44px;animation:ear 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse,.hop,.ear{animation:none}}
@media (max-width:520px){.slots{grid-template-columns:1fr}.ind{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<header><div class="wrap">
<div class="brand"><span id="logo"></span><div><b>Mo</b><span>Your running partner · sample data</span></div></div>
<button class="ghost" id="restart" type="button">Start over</button>
</div></header>
<main class="wrap" id="chat" aria-live="polite"></main>
<footer><div class="wrap">
<div id="plan"></div>
<div class="chips" id="chips"></div>
<form class="box" id="form">
<label class="sr" for="ask">Message Mo</label>
<input id="ask" type="text" autocomplete="off">
<button type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
</form>
</div></footer>
</div>
<script>
(function(){
var S, n=0, timers=[];

function rabbit(w,kind,cls){
  var ears={idle:'<rect x="36" y="4" width="18" height="50" rx="9" fill="#F26B3A"/><rect x="40" y="12" width="10" height="34" rx="5" fill="#FFD3BD"/><rect x="66" y="4" width="18" height="50" rx="9" fill="#F26B3A" transform="rotate(12 75 54)"/><rect x="70" y="12" width="10" height="34" rx="5" fill="#FFD3BD" transform="rotate(12 75 54)"/>',
  think:'<g class="ear"><rect x="36" y="4" width="18" height="50" rx="9" fill="#F26B3A"/><rect x="40" y="12" width="10" height="34" rx="5" fill="#FFD3BD"/></g><rect x="66" y="4" width="18" height="50" rx="9" fill="#F26B3A" transform="rotate(12 75 54)"/><rect x="70" y="12" width="10" height="34" rx="5" fill="#FFD3BD" transform="rotate(12 75 54)"/>',
  cheer:'<rect x="34" y="4" width="18" height="50" rx="9" fill="#F26B3A" transform="rotate(-14 43 54)"/><rect x="38" y="12" width="10" height="34" rx="5" fill="#FFD3BD" transform="rotate(-14 43 54)"/><rect x="68" y="4" width="18" height="50" rx="9" fill="#F26B3A" transform="rotate(14 77 54)"/><rect x="72" y="12" width="10" height="34" rx="5" fill="#FFD3BD" transform="rotate(14 77 54)"/>'}[kind];
  var face={idle:'<rect x="44" y="70" width="8" height="12" rx="4" fill="#2B1A12"/><rect x="68" y="70" width="8" height="12" rx="4" fill="#2B1A12"/><path d="M52 92 Q60 100 68 92" stroke="#2B1A12" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="38" cy="90" r="5" fill="#FF9B73"/><circle cx="82" cy="90" r="5" fill="#FF9B73"/>',
  think:'<rect x="44" y="74" width="8" height="5" rx="2.5" fill="#2B1A12"/><rect x="68" y="74" width="8" height="5" rx="2.5" fill="#2B1A12"/><path d="M54 95 L66 95" stroke="#2B1A12" stroke-width="3.5" stroke-linecap="round"/>',
  cheer:'<path d="M43 78 Q48 70 53 78" stroke="#2B1A12" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M67 78 Q72 70 77 78" stroke="#2B1A12" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M50 90 Q60 104 70 90 Z" fill="#2B1A12"/><circle cx="38" cy="90" r="5" fill="#FF9B73"/><circle cx="82" cy="90" r="5" fill="#FF9B73"/>'}[kind];
  return '<svg class="r '+(cls||'')+'" width="'+w+'" height="'+Math.round(w*130/120)+'" viewBox="0 0 120 130" aria-hidden="true">'+ears+'<circle cx="60" cy="82" r="44" fill="#F26B3A"/>'+face+'</svg>';
}
var CAT={
 speed:{base:{name:'Strider Tempo',price:140,why:'Light and springy, built for tempo runs and intervals.',feel:'Firm and fast'},
  cheaper:{name:'Pace Lite',price:105,why:'Last season’s model with the same light ride for less.',feel:'Firm and fast'},
  cushion:{name:'Strider Tempo Max',price:155,why:'Extra foam so fast days are easier on your legs.',feel:'Soft and bouncy'},
  alt:{name:'Northline Tempo',price:135,why:'A similar light, snappy ride from a different brand.',feel:'Firm and fast'},
  altCushion:{name:'Northline Tempo Plus',price:150,why:'More cushion for faster days, from a different brand.',feel:'Soft and bouncy'}},
 easy:{base:{name:'Cloudfield Daily',price:130,why:'A stable, cushioned trainer for easy and long runs.',feel:'Balanced'},
  cheaper:{name:'Cloudfield Daily 2',price:95,why:'The previous version, still great for easy miles.',feel:'Balanced'},
  cushion:{name:'Cloudfield Max',price:160,why:'Max cushion for long, slow miles.',feel:'Very soft'}},
 race:{base:{name:'Apex Carbon',price:250,why:'Carbon plate for race day and a few key workouts.',feel:'Propulsive'},
  cheaper:{name:'Apex Glide',price:170,why:'A nylon plate gives you most of the pop for less.',feel:'Propulsive'},
  cushion:{name:'Apex Carbon Plush',price:260,why:'A plated racer with more foam for the late miles.',feel:'Soft and propulsive'}}
};
function fresh(){return{msgs:[{id:0,who:'mo',kind:'text',text:'Hi, I’m Mo, your running partner. I’ll keep up with your training and help with the gear you need along the way.\nLet’s start with your shoe rotation. What are you training for?'}],
 stage:'race',race:null,miles:null,daily:false,flat:false,budget:null,replace:true,mode:'base',avoid:false,chosen:{},typing:false,work:0}}
function set(p){for(var k in p)S[k]=p[k];render()}
function later(ms,fn){timers.push(setTimeout(fn,ms))}
function msg(who,kind,x){n++;var m={id:n,who:who,kind:kind};for(var k in (x||{}))m[k]=x[k];return m}
function you(t){S.msgs.push(msg('you','text',{text:t}));$('ask').value='';render(true)}
function mo(build,patch,ms){S.typing=true;render(true);later(ms||800,function(){S.msgs=S.msgs.concat(build());S.typing=false;set(patch||{});scroll()})}
function scroll(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function raceName(r){return{short:'5K or 10K',half:'half marathon',full:'marathon'}[r]||'race'}
function roles(s){var r=['speed'];if(!s.daily||s.replace)r.push('easy');r.push('race');return r}
function slots(){
 var easy=!S.daily?['Missing','bad','Nothing for most of your miles.']:['Replace soon','warn','Daily trainer at 410 mi. Most last 300 to 500.'];
 var speed=['Missing','bad','Nothing for tempo runs or intervals.'];
 var race=S.flat?['Covered','ok','Your race flat has life left at 120 mi.']:S.race==='short'?['Optional','ok','Nice to have for a 5K or 10K.']:['Missing','bad',S.race==='full'?'Worth having for a marathon.':'Optional, but helps on race day.'];
 return[['Easy days',easy],['Speed',speed],['Race day',race]];
}
function picksFor(sn){
 var opt=sn.flat||sn.race==='short',top=sn.daily?'speed':'easy';
 var lab={speed:'FILLS: SPEED',easy:sn.daily?'REPLACES: EASY DAYS':'FILLS: EASY DAYS',race:opt?'RACE DAY (OPTIONAL)':'FILLS: RACE DAY'};
 return roles(sn).map(function(r){var c=CAT[r];var p=(r==='speed'&&sn.avoid)?(sn.mode==='cushion'?c.altCushion:c.alt):(c[sn.mode]||c.base);
  return{key:r,role:lab[r],name:p.name,price:p.price,why:p.why,feel:p.feel,top:r===top}});
}
function snap(){return{mode:S.mode,avoid:S.avoid,replace:S.replace,daily:S.daily,flat:S.flat,race:S.race,budget:S.budget}}
function picksMsg(intro){return[msg('mo','text',{text:intro}),msg('mo','picks',{snap:snap()})]}
function firstIntro(){var c=roles(S).length;return(c===3?'Here are three picks':'Here are two picks for the gaps')+' for your '+raceName(S.race)+' training. I put the '+(S.daily?'speed shoe':'easy day shoe')+' first because it will make the biggest difference right now.'}
function answer(stage,v,label){
 if(S.typing)return;you(label);
 if(stage==='race')mo(function(){return[msg('mo','text',{text:(v==='short'?'Nice, a fast one.':'Nice, a '+raceName(v)+'.')+' How many miles a week are you running right now?'})]},{race:v,stage:'miles'});
 else if(stage==='miles')mo(function(){return[msg('mo','text',{text:v+' miles a week, got it. What are you running in now? Rough mileage is fine.'})]},{miles:v,stage:'shoes'});
 else if(stage==='shoes')mo(function(){return[msg('mo','text',{text:'Thanks. Last one: what’s your budget for new shoes?'})]},{stage:'budget',daily:v!=='none',flat:v==='two'});
 else if(stage==='budget'){
  mo(function(){return[msg('mo','text',{text:'Perfect. Give me a moment while I look at your rotation.'}),msg('mo','status')]},{budget:v,stage:'working',work:0},600);
  later(1500,function(){set({work:1})});later(2300,function(){set({work:2})});later(3100,function(){set({work:3})});
  later(3300,function(){mo(function(){var o=[msg('mo','text',{text:'Here’s what I see before I recommend anything.'}),msg('mo','rotation')];
   if(S.daily)o.push(msg('mo','text',{text:'One question first. Your daily trainer has about 410 miles on it. Do you want me to replace it, or keep it for easy runs a bit longer and focus on the gaps?'}));
   else o=o.concat(picksMsg(firstIntro()));return o},{stage:S.daily?'replace':'done'},700)});
 } else if(stage==='replace'){S.replace=v;
  mo(function(){return picksMsg(v?'Makes sense, it’s close to the end of its life. '+firstIntro():'Got it, we’ll keep it going for now and I’ll remind you when it hits 500 miles. Here are picks for the two gaps: speed and race day.')},{stage:'done'});}
}
function refine(kind,text){
 if(S.typing)return;
 if(kind==='cheaper'){you(text||'Can you find cheaper options?');S.mode='cheaper';S.chosen={};mo(function(){return picksMsg('Here are lower priced picks. Mostly last season’s models, so the ride is nearly the same.')})}
 else if(kind==='cushion'){you(text||'I want more cushion.');S.mode='cushion';S.chosen={};mo(function(){return picksMsg('Got it. I swapped in softer versions for each role.')})}
 else if(kind==='brand'){you(text||'I don’t like Strider. What else?');S.avoid=true;S.chosen={};mo(function(){return picksMsg('No problem. I replaced the Strider shoe with a similar one from another brand. Everything else stays the same.')})}
 else if(kind==='why'){you(text||'Why these?');
  var l=['Here’s how I picked them:','Speed: you run '+S.miles+' miles a week with nothing for faster workouts. That’s your biggest gap.',
   !S.daily?'Easy days: most of your miles are easy, so you need a dedicated trainer.':(S.replace?'Easy days: your trainer is at 410 miles, and most shoes lose cushion between 300 and 500.':'Easy days: you’re keeping your trainer for now, so I left this out.'),
   S.flat?'Race day: your flat still has life, so this one is optional.':'Race day: a plated shoe helps most on race day, but it’s the one to skip if money is tight.',
   'Budget: I tried to stay near $'+S.budget+' and I’ll tell you when the full set goes over.'];
  mo(function(){return[msg('mo','text',{text:l.join('\n')})]})}
}
function replies(){
 if(S.typing)return[];
 if(S.stage==='race')return[['5K or 10K','race','short'],['Half marathon','race','half'],['Marathon','race','full']];
 if(S.stage==='miles')return[15,25,35,45].map(function(x){return[x+' miles','miles',x]});
 if(S.stage==='shoes')return[['One daily trainer, about 410 mi','shoes','one'],['A daily trainer and an old race flat','shoes','two'],['Nothing yet','shoes','none']];
 if(S.stage==='budget')return[150,300,450].map(function(x){return['$'+x,'budget',x,'Around $'+x]});
 if(S.stage==='replace')return[['Replace it','replace',true],['Keep it for now','replace',false]];
 if(S.stage==='done')return[['Cheaper options','r','cheaper'],['More cushion','r','cushion'],['Different brand','r','brand'],['Why these?','r','why']];
 return[];
}
var current=[], latest=[];
function render(doScroll){
 var last=null;S.msgs.forEach(function(m){if(m.kind==='picks')last=m.id});
 var h='';latest=[];
 S.msgs.forEach(function(m){
  if(m.who==='you'){h+='<div class="you"><div>'+esc(m.text)+'</div></div>';return}
  if(m.kind==='text')h+='<div class="mo">'+rabbit(36,'idle')+'<div class="b">'+esc(m.text)+'</div></div>';
  else if(m.kind==='status'){h+='<div class="ind card steps">';['Reading your training','Checking the shoes you own','Searching options under $'+(S.budget||0)].forEach(function(l,i){
    var d=S.work>i,a=S.work===i;h+='<div class="step"><span>'+l+'</span><b style="color:'+(d?'#1E6B3A':a?'#B5461C':'#6B7078')+'">'+(d?'Done':a?'Working…':'Waiting')+'</b></div>'});h+='</div>'}
  else if(m.kind==='rotation'){h+='<div class="ind card"><span class="lab">ROTATION CHECK</span><div class="slots">';slots().forEach(function(x){h+='<div class="slot"><b>'+x[0]+'</b><span class="badge '+x[1][1]+'">'+x[1][0]+'</span><small>'+x[1][2]+'</small></div>'});h+='</div></div>'}
  else if(m.kind==='picks'){var ps=picksFor(m.snap);
   if(m.id===last){latest=ps;h+='<div class="ind"><div class="picks">';ps.forEach(function(p){var on=!!S.chosen[p.key];
     h+='<div class="pick'+(p.top?' top':'')+'"><div class="hd"><span class="lab">'+p.role+'</span>'+(p.top?'<span class="tp">Top pick</span>':'')+'</div><span class="nm">'+esc(p.name)+'</span><span class="pr">$'+p.price+'</span><span class="wy">'+esc(p.why)+'</span><span class="fl">Feel: '+p.feel+'</span><button type="button" data-add="'+p.key+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'">'+(on?'Added to plan':'Add to plan')+'</button></div>'});
    var tot=ps.reduce(function(a,p){return a+p.price},0),rc=ps.filter(function(p){return p.key==='race'})[0],b=m.snap.budget,ok=true,t;
    if(tot<=b)t='Together these come to $'+tot+', within your $'+b+' budget.';
    else if(rc&&tot-rc.price<=b){ok=false;t='Together these come to $'+tot+', $'+(tot-b)+' over your budget. Skip the race shoe for now and you’re at $'+(tot-rc.price)+'.'}
    else{ok=false;t='Together these come to $'+tot+', $'+(tot-b)+' over your budget. Start with the top pick and add the others later.'}
    h+='</div><div class="note '+(ok?'ok':'warn')+'">'+t+'</div></div>'}
   else h+='<div class="ind old"><span class="lab">EARLIER PICKS</span><span>'+ps.map(function(p){return esc(p.name)+' $'+p.price}).join(' · ')+'</span></div>'}
 });
 if(S.typing)h+='<div class="typing">'+rabbit(36,'think','pulse')+'<span>Mo is thinking…</span></div>';
 $('chat').innerHTML=h;
 current=replies();
 $('chips').innerHTML=current.map(function(c,i){return'<button type="button" data-i="'+i+'">'+esc(c[0])+'</button>'}).join('');
 var ch=latest.filter(function(p){return S.chosen[p.key]});
 var key=ch.map(function(p){return p.key}).join();
 if(key!==render.planKey){render.planKey=key;
  $('plan').innerHTML=ch.length?'<div class="plan"><div class="l">'+rabbit(40,'cheer','hop')+'<div><b>Your plan: '+ch.length+(ch.length===1?' shoe':' shoes')+', $'+ch.reduce(function(a,p){return a+p.price},0)+'</b><small>'+ch.map(function(p){return esc(p.name)}).join(' + ')+'</small></div></div><button type="button" id="find">Find best prices</button></div>':''}
 $('ask').placeholder={race:'Training for a half in March…',miles:'About 35 miles…',shoes:'Describe your current shoes…',budget:'Around $300…',replace:'Replace it or keep it…',done:'Ask for cheaper, softer, another brand…'}[S.stage]||'Message Mo';
 if(doScroll)scroll();
}
function send(){
 var t=$('ask').value.trim();if(!t||S.typing)return;var q=t.toLowerCase(),num=parseInt(q.replace(/[^0-9]/g,''),10);
 if(S.stage==='race'){if(/marathon/.test(q)&&!/half/.test(q))return answer('race','full',t);if(/half|13/.test(q))return answer('race','half',t);if(/5 ?k|10 ?k/.test(q))return answer('race','short',t)}

 else if(S.stage==='shoes'){if(/nothing|none|no shoes/.test(q))return answer('shoes','none',t);if(/flat|race|two|2/.test(q))return answer('shoes','two',t);return answer('shoes','one',t)}
